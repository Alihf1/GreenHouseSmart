<!DOCTYPE html>



<html dir="rtl" lang="ar">



<head>



<meta charset="utf-8">



<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">



<title>المحمية الزراعية الذكية</title>



<link rel="manifest" href="manifest.webmanifest">



<link rel="apple-touch-icon" href="apple-touch-icon.png">



<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">



<meta name="theme-color" content="#091e18" media="(prefers-color-scheme: dark)">



<meta name="theme-color" content="#f7fffc" media="(prefers-color-scheme: light)">



<meta name="apple-mobile-web-app-capable" content="yes">



<meta name="mobile-web-app-capable" content="yes">



<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">



<meta name="apple-mobile-web-app-title" content="المحمية">



  <style>



html, body{min-height:100dvh;}



:root{



  --text:#f2fff9;



  --muted:#bfe6d6;



  --stroke:rgba(255,255,255,.28);



  --card-bg:linear-gradient(155deg,rgba(255,255,255,.22),rgba(255,255,255,.02) 42%),rgba(255,255,255,.1);



  --shadow:0 10px 30px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.35);



  --shadow-hover:0 18px 40px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.45);



  --seg-bg:rgba(255,255,255,.06);



  --device-bg:linear-gradient(155deg,rgba(255,255,255,.16),rgba(255,255,255,.03));



  --device-border:rgba(255,255,255,.2);



  --dico-bg:rgba(255,255,255,.14);



  --btn-bg:rgba(255,255,255,.12);



  --btn-border:rgba(255,255,255,.24);



  --pill-bg:linear-gradient(155deg,rgba(255,255,255,.22),rgba(255,255,255,.04));



  --glow1:#0f5c46;



  --glow2:#1b4a6b;



   --glow-op:.32;



   --bar-bg:rgba(255,255,255,.16);



   --bar-inner:inset 0 0 0 1px rgba(255,255,255,.14);



   --h1-shadow:0 2px 12px rgba(0,0,0,.25);



   --big-shadow:0 2px 10px rgba(0,0,0,.22);



   --page-bg:linear-gradient(135deg,#091e18,#0b131a 60%,#091e18);



}



@media (prefers-color-scheme: light){



  :root{



 --page-bg:linear-gradient(135deg,#f7fffc,#f2f7f5 60%,#f7fffc);



  }



}



body.light{



  --text:#0e2a22;



  --muted:#4a6b5f;



  --stroke:rgba(255,255,255,.85);



  --card-bg:linear-gradient(155deg,rgba(255,255,255,.88),rgba(255,255,255,.62)),rgba(255,255,255,.62);



  --shadow:0 10px 26px rgba(20,60,50,.14),inset 0 1px 0 rgba(255,255,255,.9);



  --shadow-hover:0 18px 36px rgba(20,60,50,.2),inset 0 1px 0 rgba(255,255,255,.95);



  --seg-bg:rgba(13,43,34,.06);



  --device-bg:linear-gradient(155deg,rgba(255,255,255,.92),rgba(255,255,255,.72));



  --device-border:rgba(13,43,34,.1);



  --dico-bg:rgba(13,43,34,.06);



  --btn-bg:rgba(13,43,34,.06);



  --btn-border:rgba(13,43,34,.12);



  --pill-bg:linear-gradient(155deg,rgba(255,255,255,.92),rgba(255,255,255,.72));



  --glow1:#8fe3c2;



  --glow2:#9fd0f2;



  --glow-op:.5;



  --bar-bg:rgba(13,43,34,.1);



  --bar-inner:inset 0 0 0 1px rgba(13,43,34,.06);



  --h1-shadow:0 1px 6px rgba(20,60,50,.15);



  --big-shadow:none;



  --page-bg:linear-gradient(135deg,#eaf7f0,#e3f0fb 55%,#eaf7f0);



}



*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}



body{



   font-family:Tahoma,Arial,sans-serif;min-height:100vh;color:var(--text);



   background:var(--page-bg);background-attachment:fixed;background-size:cover;-webkit-background-size:cover;



   position:relative;overflow-x:hidden;padding:18px 14px calc(34px + env(safe-area-inset-bottom, 14px));



   transition:color .35s ease;



 }



body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(130px);opacity:var(--glow-op);z-index:0;pointer-events:none;transition:background .4s ease}



body::before{width:360px;height:360px;background:var(--glow1);top:-120px;right:-110px}



body::after{width:340px;height:340px;background:var(--glow2);bottom:-130px;left:-120px}



.wrap{position:relative;z-index:1;max-width:580px;margin:0 auto}







.theme-toggle{position:fixed;top:14px;left:14px;z-index:6;width:46px;height:46px;border-radius:50%;



  border:1px solid var(--stroke);background:var(--card-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);



  color:var(--text);font-size:20px;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s,background .35s}



.theme-toggle:active{transform:scale(.9)}







header{text-align:center;margin-bottom:14px}



header h1{font-size:22px;letter-spacing:.3px;text-shadow:var(--h1-shadow)}



header p{font-size:12.5px;color:var(--muted);margin-top:5px}



.pill{display:inline-flex;align-items:center;gap:9px;margin-top:12px;padding:7px 15px;border-radius:999px;



  background:var(--pill-bg);border:1px solid var(--stroke);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);



  font-size:12.5px;font-weight:bold;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}



.dot{width:9px;height:9px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:pulse 1.6s infinite}



.dot.bad{background:#f87171;animation:none;box-shadow:none}



@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%{box-shadow:0 0 0 11px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}







#warn{display:none;align-items:center;justify-content:center;gap:10px;margin:14px 0;padding:13px;border-radius:16px;



  background:rgba(239,68,68,.2);border:1px solid rgba(248,113,113,.6);color:#ffdada;font-weight:bold;font-size:13.5px;



  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:warnpulse 1.5s infinite}



body.light #warn{color:#9b1c1c}



@keyframes warnpulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 9px rgba(239,68,68,0)}}







.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}



.card{



  background:var(--card-bg);border:1px solid var(--stroke);border-radius:18px;padding:14px;position:relative;



  backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);



  box-shadow:var(--shadow);transition:transform .28s ease,box-shadow .28s ease,background .35s ease;



  animation:fadeup .5s ease both;



}



.card:hover{transform:translateY(-5px);box-shadow:var(--shadow-hover)}



.card:active{transform:translateY(-2px) scale(.995)}



@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}







.card .top{display:flex;align-items:center;gap:9px;margin-bottom:9px}



.ico{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;box-shadow:0 6px 14px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.35)}



.ic-temp{background:linear-gradient(135deg,#ff9a5a,#ff5f6d)}



.ic-hum{background:linear-gradient(135deg,#56ccf2,#2f80ed)}



.ic-soil{background:linear-gradient(135deg,#c79a63,#8d5a2b)}



.ic-water{background:linear-gradient(135deg,#43e0d0,#1a9bd7)}



.ic-light{background:linear-gradient(135deg,#ffd54a,#ff9f1c)}



.card h2{font-size:12.5px;font-weight:600;color:var(--muted)}



.big{font-size:31px;font-weight:800;line-height:1.1;text-shadow:var(--big-shadow)}



.big small{font-size:14px;font-weight:700;color:var(--muted)}



.sub{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}



.full{grid-column:1/-1}







.bar{height:12px;border-radius:999px;background:var(--bar-bg);overflow:hidden;margin-top:12px;box-shadow:var(--bar-inner)}



.bar i{display:block;height:100%;width:0;border-radius:999px;



  background:linear-gradient(90deg,#ffd54a,#34d399);box-shadow:0 0 16px rgba(52,211,153,.85);transition:width .6s ease}







.control .top{margin-bottom:12px}



.seg{display:flex;gap:6px;margin-bottom:14px;background:var(--seg-bg);padding:6px;border-radius:16px;border:1px solid var(--device-border)}



.seg button{flex:1;border:0;padding:12px;border-radius:12px;font-family:inherit;font-size:14px;font-weight:800;



  color:var(--muted);background:transparent;cursor:pointer;transition:background .22s,color .22s,transform .12s,box-shadow .22s}



.seg button:active{transform:scale(.96)}



.seg button.active{background:linear-gradient(135deg,#2f80ed,#56ccf2);color:#fff;box-shadow:0 8px 20px rgba(47,128,237,.5),inset 0 1px 0 rgba(255,255,255,.4)}







.devices{display:flex;flex-direction:column;gap:10px}



.device{



  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;



  background:var(--device-bg);border:1px solid var(--device-border);border-radius:15px;padding:12px 13px;



  transition:background .35s,border-color .35s,transform .12s}



.device:active{transform:scale(.995)}



.device .dinfo{display:flex;align-items:center;gap:10px;min-width:120px}



.dico{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;



  background:var(--dico-bg);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}



.dname{font-size:14.5px;font-weight:700}



.status{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;margin-top:3px;transition:.25s}



.st-on{background:rgba(52,211,153,.25);color:#6ef2b7;border:1px solid rgba(52,211,153,.65);box-shadow:0 0 12px rgba(52,211,153,.35)}



.st-off{background:rgba(248,113,113,.22);color:#ffb3b3;border:1px solid rgba(248,113,113,.55)}



body.light .st-on{color:#0b7a52}



body.light .st-off{color:#b91c1c}



.btns{display:flex;gap:6px}



.btns button{border:1px solid var(--btn-border);padding:9px 15px;border-radius:11px;font-family:inherit;



  font-size:13px;font-weight:800;cursor:pointer;color:var(--text);background:var(--btn-bg);



  transition:background .2s,transform .1s,box-shadow .2s,color .2s,border-color .2s}



.btns button:hover{background:var(--dico-bg)}



.btns button:active{transform:scale(.9)}



.btns button.sel-on{background:linear-gradient(135deg,#22c55e,#34d399);border-color:transparent;color:#04231a;box-shadow:0 8px 18px rgba(34,197,94,.5)}



.btns button.sel-off{background:linear-gradient(135deg,#ef4444,#f87171);border-color:transparent;color:#2a0606;box-shadow:0 8px 18px rgba(239,68,68,.45)}



#upd{text-align:center;font-size:11px;color:var(--muted);margin-top:12px}







@media(max-width:400px){



  body{padding:14px 10px 28px}



  header h1{font-size:19px}



  .big{font-size:26px}



  .ico{width:32px;height:32px;font-size:16px}



  .btns button{padding:8px 12px;font-size:12.5px}



  .device{padding:11px}



}

</style>



</head>
